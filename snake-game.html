<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Battle Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
        }

        h1 {
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            font-size: 1.8rem;
        }

        .score-board {
            display: flex;
            gap: 20px;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 10px;
            color: #fff;
            text-align: center;
        }

        .score-item .label {
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .score-item .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00ff88;
        }

        #gameCanvas {
            border: 3px solid #e94560;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            background: #0a0a15;
            cursor: none;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-start {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #1a1a2e;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .btn-restart {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: #fff;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #fff;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 15px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .game-over-content {
            text-align: center;
            color: #fff;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .game-over-content h2 {
            font-size: 3rem;
            color: #e94560;
            margin-bottom: 20px;
        }

        .game-over-content p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .final-score {
            color: #00ff88;
            font-weight: bold;
        }

        .instructions {
            color: #aaa;
            font-size: 0.85rem;
            text-align: center;
            max-width: 700px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Snake Battle Arena</h1>
            <div class="score-board">
                <div class="score-item">
                    <div class="label">Score</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="score-item">
                    <div class="label">Length</div>
                    <div class="value" id="length">10</div>
                </div>
                <div class="score-item">
                    <div class="label">Kills</div>
                    <div class="value" id="kills">0</div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="1200" height="700"></canvas>

        <div class="controls">
            <button class="btn-start" id="startBtn">Start Game</button>
            <button class="btn-restart" id="restartBtn" style="display: none;">Restart</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #00ff88;"></div>
                <span>You</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ff6b6b;"></div>
                <span>AI Snakes</span>
            </div>
            <div class="legend-item"><span>🍒5</span></div>
            <div class="legend-item"><span>🍎10</span></div>
            <div class="legend-item"><span>🍓12</span></div>
            <div class="legend-item"><span>🍊15</span></div>
            <div class="legend-item"><span>🥝16</span></div>
            <div class="legend-item"><span>🍌18</span></div>
            <div class="legend-item"><span>🍇25</span></div>
            <div class="legend-item"><span>🍉35</span></div>
            <div class="legend-item"><span>💎50</span></div>
            <div class="legend-item"><span>⭐100</span></div>
        </div>

        <p class="instructions">
            Move your mouse to guide the snake smoothly across the map. Eat food to grow and score points!<br>
            If another snake hits you, they die. If you hit another snake, you die!
        </p>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-content">
            <h2>Game Over!</h2>
            <p>Final Score: <span class="final-score" id="finalScore">0</span></p>
            <button class="btn-restart" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Game Constants
        const CANVAS_WIDTH = 1200;
        const CANVAS_HEIGHT = 700;
        const SNAKE_SPEED = 3;
        const SNAKE_RADIUS = 10;
        const SEGMENT_SPACING = 5;
        const TURN_SPEED = 0.15;

        // Food Types
        const FOOD_TYPES = [
            { name: 'cherry', color: '#dc143c', points: 5, emoji: '🍒', probability: 0.15, growth: 2, radius: 8 },
            { name: 'apple', color: '#ff0000', points: 10, emoji: '🍎', probability: 0.18, growth: 3, radius: 10 },
            { name: 'strawberry', color: '#ff6b9d', points: 12, emoji: '🍓', probability: 0.12, growth: 3, radius: 10 },
            { name: 'orange', color: '#ffa500', points: 15, emoji: '🍊', probability: 0.12, growth: 4, radius: 12 },
            { name: 'kiwi', color: '#8bc34a', points: 16, emoji: '🥝', probability: 0.10, growth: 4, radius: 12 },
            { name: 'banana', color: '#ffff00', points: 18, emoji: '🍌', probability: 0.10, growth: 5, radius: 12 },
            { name: 'grape', color: '#800080', points: 25, emoji: '🍇', probability: 0.08, growth: 6, radius: 14 },
            { name: 'watermelon', color: '#2ecc71', points: 35, emoji: '🍉', probability: 0.06, growth: 8, radius: 16 },
            { name: 'diamond', color: '#00ffff', points: 50, emoji: '💎', probability: 0.05, growth: 10, radius: 14 },
            { name: 'star', color: '#ffd700', points: 100, emoji: '⭐', probability: 0.04, growth: 15, radius: 16 }
        ];

        // Game State
        let canvas, ctx;
        let gameRunning = false;
        let animationId;
        let score = 0;
        let kills = 0;
        let mouseX = CANVAS_WIDTH / 2;
        let mouseY = CANVAS_HEIGHT / 2;

        // Snakes and food
        let playerSnake = null;
        let aiSnakes = [];
        let foods = [];
        const NUM_AI_SNAKES = 5;
        const MAX_FOOD = 40;

        // Smooth Snake Class
        class Snake {
            constructor(x, y, color, isPlayer = false) {
                this.segments = [];
                this.color = color;
                this.isPlayer = isPlayer;
                this.alive = true;
                this.angle = isPlayer ? 0 : Math.random() * Math.PI * 2; // Player starts facing right
                this.targetAngle = this.angle;
                this.speed = SNAKE_SPEED;
                this.radius = SNAKE_RADIUS;
                this.score = 0;
                this.eatenFood = [];
                this.targetLength = 10; // Track intended length for smooth growth

                // Initialize segments
                const initialLength = 10;
                for (let i = 0; i < initialLength; i++) {
                    this.segments.push({
                        x: x - i * SEGMENT_SPACING * Math.cos(this.angle),
                        y: y - i * SEGMENT_SPACING * Math.sin(this.angle)
                    });
                }

                // AI properties
                this.aiTarget = null;
                this.aiChangeTimer = 0;
            }

            get head() {
                return this.segments[0];
            }

            get length() {
                return this.targetLength;
            }

            setTargetAngle(angle) {
                this.targetAngle = angle;
            }

            update() {
                if (!this.alive) return;

                // Smoothly interpolate angle
                let angleDiff = this.targetAngle - this.angle;

                // Normalize angle difference to -PI to PI
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

                this.angle += angleDiff * TURN_SPEED;

                // Store old head position for the chain
                const oldHeadX = this.segments[0].x;
                const oldHeadY = this.segments[0].y;

                // Move head forward
                this.segments[0].x += Math.cos(this.angle) * this.speed;
                this.segments[0].y += Math.sin(this.angle) * this.speed;

                // Wrap around edges smoothly
                if (this.segments[0].x < 0) this.segments[0].x = CANVAS_WIDTH;
                if (this.segments[0].x > CANVAS_WIDTH) this.segments[0].x = 0;
                if (this.segments[0].y < 0) this.segments[0].y = CANVAS_HEIGHT;
                if (this.segments[0].y > CANVAS_HEIGHT) this.segments[0].y = 0;

                // Each segment follows the one in front of it smoothly
                let prevX = oldHeadX;
                let prevY = oldHeadY;

                for (let i = 1; i < this.segments.length; i++) {
                    const current = this.segments[i];
                    const tempX = current.x;
                    const tempY = current.y;

                    const dx = prevX - current.x;
                    const dy = prevY - current.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // Move segment to follow the one in front
                    if (dist > SEGMENT_SPACING) {
                        current.x = prevX - (dx / dist) * SEGMENT_SPACING;
                        current.y = prevY - (dy / dist) * SEGMENT_SPACING;
                    }

                    prevX = tempX;
                    prevY = tempY;
                }
            }

            grow(amount) {
                // Add segments at the tail that will follow along
                this.targetLength += amount;
                const tail = this.segments[this.segments.length - 1];
                const secondLast = this.segments[this.segments.length - 2] || tail;

                // Calculate direction from second-last to tail
                const dx = tail.x - secondLast.x;
                const dy = tail.y - secondLast.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const dirX = dx / dist;
                const dirY = dy / dist;

                // Add new segments extending in the same direction
                for (let i = 0; i < amount; i++) {
                    const lastSeg = this.segments[this.segments.length - 1];
                    this.segments.push({
                        x: lastSeg.x + dirX * SEGMENT_SPACING,
                        y: lastSeg.y + dirY * SEGMENT_SPACING
                    });
                }
            }

            draw(ctx) {
                if (!this.alive) return;

                // Draw body segments with gradient
                for (let i = this.segments.length - 1; i >= 0; i--) {
                    const segment = this.segments[i];
                    const isHead = i === 0;

                    // Size variation - head is bigger, player is slightly bigger
                    const baseSize = this.isPlayer ? this.radius * 1.1 : this.radius;
                    const size = isHead ? baseSize : baseSize * 0.85;

                    // Alpha gradient from tail to head
                    const alpha = 0.4 + (0.6 * (this.segments.length - i) / this.segments.length);

                    // Player gets a white outline glow
                    if (this.isPlayer) {
                        ctx.globalAlpha = alpha * 0.5;
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(segment.x, segment.y, size + 3, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(segment.x, segment.y, size, 0, Math.PI * 2);
                    ctx.fill();

                    // Draw eyes on head
                    if (isHead) {
                        ctx.globalAlpha = 1;

                        // Eye positions based on angle
                        const eyeOffset = this.radius * 0.4;
                        const eyeAngle1 = this.angle - 0.5;
                        const eyeAngle2 = this.angle + 0.5;

                        const eye1X = segment.x + Math.cos(eyeAngle1) * eyeOffset;
                        const eye1Y = segment.y + Math.sin(eyeAngle1) * eyeOffset;
                        const eye2X = segment.x + Math.cos(eyeAngle2) * eyeOffset;
                        const eye2Y = segment.y + Math.sin(eyeAngle2) * eyeOffset;

                        // White of eyes
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(eye1X, eye1Y, 4, 0, Math.PI * 2);
                        ctx.arc(eye2X, eye2Y, 4, 0, Math.PI * 2);
                        ctx.fill();

                        // Pupils
                        ctx.fillStyle = '#000';
                        const pupilOffset = 1.5;
                        ctx.beginPath();
                        ctx.arc(eye1X + Math.cos(this.angle) * pupilOffset, eye1Y + Math.sin(this.angle) * pupilOffset, 2, 0, Math.PI * 2);
                        ctx.arc(eye2X + Math.cos(this.angle) * pupilOffset, eye2Y + Math.sin(this.angle) * pupilOffset, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
            }

            dropFood() {
                const droppedFood = [];
                // Drop food along the body
                for (let i = 0; i < this.segments.length; i += 3) {
                    const segment = this.segments[i];
                    droppedFood.push({
                        x: segment.x + (Math.random() - 0.5) * 20,
                        y: segment.y + (Math.random() - 0.5) * 20,
                        type: getRandomFoodType()
                    });
                }
                return droppedFood;
            }
        }

        // AI behavior
        function updateAI(snake) {
            if (!snake.alive) return;

            snake.aiChangeTimer--;

            // Find new target periodically or if no target
            if (snake.aiChangeTimer <= 0 || !snake.aiTarget) {
                snake.aiChangeTimer = 60 + Math.random() * 60;

                // Find nearest food
                let nearestFood = null;
                let nearestDist = Infinity;

                for (const food of foods) {
                    const dx = food.x - snake.head.x;
                    const dy = food.y - snake.head.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestFood = food;
                    }
                }

                snake.aiTarget = nearestFood;
            }

            // Move towards target
            if (snake.aiTarget) {
                const dx = snake.aiTarget.x - snake.head.x;
                const dy = snake.aiTarget.y - snake.head.y;
                snake.setTargetAngle(Math.atan2(dy, dx));
            }

            // Avoid player if too close
            if (playerSnake && playerSnake.alive) {
                const dx = playerSnake.head.x - snake.head.x;
                const dy = playerSnake.head.y - snake.head.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 100) {
                    // Turn away from player
                    snake.setTargetAngle(Math.atan2(-dy, -dx));
                }
            }
        }

        // Get random food type
        function getRandomFoodType() {
            const rand = Math.random();
            let cumulative = 0;
            for (const type of FOOD_TYPES) {
                cumulative += type.probability;
                if (rand <= cumulative) return type;
            }
            return FOOD_TYPES[0];
        }

        // Spawn food
        function spawnFood() {
            if (foods.length >= MAX_FOOD) return;

            const padding = 30;
            foods.push({
                x: padding + Math.random() * (CANVAS_WIDTH - padding * 2),
                y: padding + Math.random() * (CANVAS_HEIGHT - padding * 2),
                type: getRandomFoodType()
            });
        }

        // Check collision between point and snake body
        function checkCollisionWithSnake(x, y, snake, skipHead = false) {
            const startIndex = skipHead ? 10 : 0; // Skip first segments to avoid self-collision issues
            for (let i = startIndex; i < snake.segments.length; i++) {
                const segment = snake.segments[i];
                const dx = x - segment.x;
                const dy = y - segment.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < snake.radius + 5) {
                    return true;
                }
            }
            return false;
        }

        // Draw food
        function drawFood() {
            for (const food of foods) {
                // Glow effect
                ctx.shadowColor = food.type.color;
                ctx.shadowBlur = 15;

                // Draw circle
                ctx.fillStyle = food.type.color;
                ctx.beginPath();
                ctx.arc(food.x, food.y, food.type.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw emoji
                ctx.shadowBlur = 0;
                ctx.font = `${food.type.radius * 1.5}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(food.type.emoji, food.x, food.y);
            }
            ctx.shadowBlur = 0;
        }

        // Main update
        function update() {
            if (!gameRunning) return;

            // Update player direction based on mouse
            if (playerSnake && playerSnake.alive) {
                const dx = mouseX - playerSnake.head.x;
                const dy = mouseY - playerSnake.head.y;
                playerSnake.setTargetAngle(Math.atan2(dy, dx));
                playerSnake.update();
            }

            // Update AI snakes
            for (const snake of aiSnakes) {
                if (snake.alive) {
                    updateAI(snake);
                    snake.update();
                }
            }

            // Check player eating food
            if (playerSnake && playerSnake.alive) {
                for (let i = foods.length - 1; i >= 0; i--) {
                    const food = foods[i];
                    const dx = food.x - playerSnake.head.x;
                    const dy = food.y - playerSnake.head.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < playerSnake.radius + food.type.radius) {
                        playerSnake.grow(food.type.growth);
                        playerSnake.eatenFood.push(food.type);
                        score += food.type.points;
                        foods.splice(i, 1);
                        updateScoreDisplay();
                    }
                }
            }

            // Check AI eating food
            for (const snake of aiSnakes) {
                if (!snake.alive) continue;

                for (let i = foods.length - 1; i >= 0; i--) {
                    const food = foods[i];
                    const dx = food.x - snake.head.x;
                    const dy = food.y - snake.head.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < snake.radius + food.type.radius) {
                        snake.grow(food.type.growth);
                        snake.eatenFood.push(food.type);
                        snake.score += food.type.points;
                        foods.splice(i, 1);
                    }
                }
            }

            // Check collisions - player vs AI
            if (playerSnake && playerSnake.alive) {
                for (const aiSnake of aiSnakes) {
                    if (!aiSnake.alive) continue;

                    // Player head hits AI body -> player dies
                    if (checkCollisionWithSnake(playerSnake.head.x, playerSnake.head.y, aiSnake, false)) {
                        killSnake(playerSnake);
                    }

                    // AI head hits player body -> AI dies
                    if (checkCollisionWithSnake(aiSnake.head.x, aiSnake.head.y, playerSnake, false)) {
                        killSnake(aiSnake);
                        kills++;
                        updateScoreDisplay();
                    }
                }
            }

            // AI vs AI collisions
            for (let i = 0; i < aiSnakes.length; i++) {
                for (let j = 0; j < aiSnakes.length; j++) {
                    if (i === j) continue;
                    const snake1 = aiSnakes[i];
                    const snake2 = aiSnakes[j];
                    if (!snake1.alive || !snake2.alive) continue;

                    if (checkCollisionWithSnake(snake1.head.x, snake1.head.y, snake2, false)) {
                        killSnake(snake1);
                    }
                }
            }

            // Spawn food
            if (Math.random() < 0.03) {
                spawnFood();
            }

            // Respawn AI
            for (const snake of aiSnakes) {
                if (!snake.alive && !snake.respawnTimer) {
                    snake.respawnTimer = setTimeout(() => {
                        respawnAISnake(snake);
                    }, 3000);
                }
            }

            // Check game over
            if (playerSnake && !playerSnake.alive) {
                gameOver();
            }
        }

        // Kill snake
        function killSnake(snake) {
            if (!snake.alive) return;
            snake.alive = false;

            // Drop food
            const droppedFood = snake.dropFood();
            for (const food of droppedFood) {
                if (food.x > 0 && food.x < CANVAS_WIDTH && food.y > 0 && food.y < CANVAS_HEIGHT) {
                    foods.push(food);
                }
            }
        }

        // Respawn AI snake
        function respawnAISnake(snake) {
            const x = 100 + Math.random() * (CANVAS_WIDTH - 200);
            const y = 100 + Math.random() * (CANVAS_HEIGHT - 200);

            snake.segments = [];
            snake.angle = Math.random() * Math.PI * 2;
            snake.targetAngle = snake.angle;
            snake.alive = true;
            snake.eatenFood = [];
            snake.score = 0;
            snake.targetLength = 10;
            snake.respawnTimer = null;
            snake.aiTarget = null;

            const initialLength = 10;
            for (let i = 0; i < initialLength; i++) {
                snake.segments.push({
                    x: x - i * SEGMENT_SPACING * Math.cos(snake.angle),
                    y: y - i * SEGMENT_SPACING * Math.sin(snake.angle)
                });
            }
        }

        // Render
        function render() {
            // Clear with gradient background
            const gradient = ctx.createRadialGradient(CANVAS_WIDTH/2, CANVAS_HEIGHT/2, 0, CANVAS_WIDTH/2, CANVAS_HEIGHT/2, CANVAS_WIDTH/2);
            gradient.addColorStop(0, '#0f0f1a');
            gradient.addColorStop(1, '#050510');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw subtle background pattern
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            const spacing = 50;
            for (let x = 0; x < CANVAS_WIDTH; x += spacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < CANVAS_HEIGHT; y += spacing) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }

            // Draw food
            drawFood();

            // Draw AI snakes
            for (const snake of aiSnakes) {
                snake.draw(ctx);
            }

            // Draw player on top
            if (playerSnake) {
                playerSnake.draw(ctx);
            }

            // Draw cursor indicator
            if (gameRunning && playerSnake && playerSnake.alive) {
                ctx.strokeStyle = 'rgba(0, 255, 136, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 15, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;

            update();
            render();

            animationId = requestAnimationFrame(gameLoop);
        }

        // Update score display
        function updateScoreDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('length').textContent = playerSnake ? playerSnake.length : 0;
            document.getElementById('kills').textContent = kills;
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').style.display = 'flex';
            document.getElementById('restartBtn').style.display = 'inline-block';
            document.getElementById('startBtn').style.display = 'none';
        }

        // Initialize game
        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            // Create player snake
            playerSnake = new Snake(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, '#00ff88', true);

            // Create AI snakes
            const aiColors = ['#ff6b6b', '#feca57', '#54a0ff', '#5f27cd', '#ff9ff3'];
            aiSnakes = [];
            for (let i = 0; i < NUM_AI_SNAKES; i++) {
                const x = 100 + Math.random() * (CANVAS_WIDTH - 200);
                const y = 100 + Math.random() * (CANVAS_HEIGHT - 200);
                aiSnakes.push(new Snake(x, y, aiColors[i % aiColors.length], false));
            }

            // Spawn initial food
            foods = [];
            for (let i = 0; i < 25; i++) {
                spawnFood();
            }

            // Reset score
            score = 0;
            kills = 0;
            updateScoreDisplay();
        }

        // Start game
        function startGame() {
            initGame();
            gameRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'inline-block';

            animationId = requestAnimationFrame(gameLoop);
        }

        // Restart game
        function restartGame() {
            document.getElementById('gameOverOverlay').style.display = 'none';

            for (const snake of aiSnakes) {
                if (snake.respawnTimer) {
                    clearTimeout(snake.respawnTimer);
                }
            }

            startGame();
        }

        // Mouse controls
        document.getElementById('gameCanvas').addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // Touch controls
        document.getElementById('gameCanvas').addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
        });

        // Button handlers
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', restartGame);

        // Initial render
        window.onload = () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.fillStyle = '#fff';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Press "Start Game" to begin!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
        };
    </script>
</body>
</html>
